[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-phap-luat"
version = "0.1.0"
description = "MCP server tra cứu văn bản pháp luật Việt Nam (dùng cá nhân)"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.27,<2",
  "python-docx>=1.1",
  "pypdf>=4.0",
  "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
phapluat = "phapluat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
