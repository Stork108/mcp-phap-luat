e=\"font-size: 14px;\"></span>\n<div style=\"width: 120px; margin: 4px auto 0; border-bottom: 1p"])</script><script>self.__next_f.push([1, "x solid #000;\"></div>\n</div>\n</div><span style=\"font-size: 14px;\"></span>\n<div style=\"width: 100%; display: table; table-layout: fixed; margin-top: 16px; line-height: 1.2; margin-bottom: 16px;\">\n<span style=\"font-size: 14px;\"></span>\n<div style=\"display: table-cell; width: 50%; text-align: center; vertical-align: top;\">\n<span style=\"font-size: 14px;\">Số: 70/2023/NQ-HĐND</span>\n</div><span style=\"font-size: 14px;\"></span>\n<div style=\"display: table-cell; width: 50%; text-align: center; vertical-align: top; font-style: italic;\">\n<span style=\"font-size: 14px;\">Bắc Giang, ngày 13 tháng 12 năm 2023</span>\n</div>\n</div>\n</div>\n</div>\n<h2 style=\"text-align: center;\"><span style=\"font-size: 14px;\">NGHỊ QUYẾT</span></h2>\n<p align=\"center\"><span style=\"font-size: 14px;\"><strong>Quy định tỷ lệ điều tiết và sử dụng phí bảo vệ môi trường </strong></span></p>\n<p align=\"center\"><span style=\"font-size: 14px;\"><strong>đối với nước thải trên địa bàn tỉnh Bắc Giang</strong></span></p>\n<p align=\"center\"><span style=\"font-size: 14px;\"><strong>__________________</strong></span></p>\n<p align=\"center\"><span style=\"font-size: 14px;\"><strong>HỘI ĐỒNG NHÂN DÂN TỈNH BẮC GIANG</strong></span></p>\n<p align=\"center\"><span style=\"font-size: 14px;\"><strong>KHÓA XIX, KỲ HỌP THỨ 14</strong></span></p>\n<p><span style=\"font-size: 14px;\"><em>Căn cứ Luật Tổ chức Chính quyền địa phương ngày 19 tháng 6 năm 2015; Luật Sửa đổi, bổ sung một số điều của Luật Tổ chức chính phủ và Luật Tổ chức chính quyền địa phương ngày 22 tháng 11 năm 2019;</em></span></p>\n<p><span style=\"font-size: 14px;\"><em>Căn cứ Luật Ban hành văn bản quy phạm pháp luật ngày 22 tháng 6 năm 2015; Luật Sửa đổi, bổ sung một số điều của Luật Ban hành văn bản quy phạm pháp luật ngày 18 tháng 6 năm 2020;</em></span></p>\n<p><span style=\"font-size: 14px;\"><em>Căn cứ Luật Ngân sách nhà nước ngày </em><em>25</em><em> tháng </em><em>6</em><em> năm 20</em><em>15;</em></span></p>\n<p><span style=\"font-size: 14px;\"><em>Căn cứ Luật Phí và lệ phí ngày 25 tháng 11 năm 2015;</em></span></p>\n<p><span style=\"font-size: 14px;\"><em>Căn cứ Luật Bảo vệ môi trường ngày 17 tháng 11 năm 2020;</em></span></p>\n<p><span style=\"font-size: 14px;\"><em>Căn cứ Nghị định s</em><em>ố</em> <em><em><a rel=\"noopener noreferrer\" target=\"_blank\">53/2020/NĐ-CP</a></em> ngày </em><em>05</em><em> th</em><em>áng 5</em><em> năm 20</em><em>20</em><em> của Chính phủ </em><em>quy định phí bảo vệ môi trường đối với nước thải;</em></span></p>\n<p><span style=\"font-size: 14px;\"><em>Xét Tờ trình số 374</em><em>/TTr-UBND ngày 28</em><em> tháng 11 </em><em>năm 2023 của Ủy ban nhân dân tỉnh; Báo cáo thẩm tra của Ban K</em><em>inh tế - N</em><em>gân sách;</em><em> ý kiến thảo luận của đại biểu Hội đồng nhân dân tỉnh tại kỳ họp.</em></span><span style=\"font-size: 14px;\"> </span></p>\n<p align=\"center\"><span style=\"font-size: 14px;\"><strong>QUYẾT NGHỊ:</strong></span><span style=\"font-size: 14px;\"> </span></p>\n<p class=\"prov-article\" id=\"6b4236ba-df4e-11f0-97b5-4b5ffc5d5a66\" style=\"font-family: 'Times New Roman', Times, serif;\"><span style=\"font-size: 14px;\"><strong>Điều 1. </strong>Quy định tỷ lệ điều tiết và sử dụng phí bảo vệ môi trường đối với nước thải trên địa bàn tỉnh Bắc Giang sau khi trừ số tiền phí được để lại theo quy định tại điểm a khoản 1, điểm b khoản 2 Điều 9 Nghị định số <a rel=\"noopener noreferrer\" target=\"_blank\">53/2020/NĐ-CP</a> ngày 05 tháng 5 năm 2020 của Chính phủ Quy định phí bảo vệ môi trường đối với nước thải như sau:</span></p>\n<p class=\"prov-clause\" id=\"6b4236c4-df4e-11f0-8bb8-175ce35c7c5a\" style=\"font-famil"])</script><script>self.__next_f.push([1, "y: 'Times New Roman', Times, serif;\">1. Đối với nước thải sinh hoạt:</p>\n<p class=\"prov-item\" id=\"6b4236ce-df4e-11f0-aee7-7d3b66aeae42\" style=\"font-family: 'Times New Roman', Times, serif;\">a) Điều tiết 20% vào ngân sách cấp tỉnh để bổ sung cho Quỹ bảo vệ môi trường tỉnh sử dụng cho việc phòng ngừa, hạn chế, kiểm soát ô nhiễm môi trường do nước thải.</p>\n<p class=\"prov-item\" id=\"6b4236d8-df4e-11f0-a15a-e5791713f1cc\" style=\"font-family: 'Times New Roman', Times, serif;\">b) Điều tiết 80% còn lại như sau:</p>\n<p class=\"prov-content\" style=\"font-family: 'Times New Roman', Times, serif;\"><span style=\"font-size: 14px;\">Đối với Thành phố Bắc Giang và các thị xã: Điều tiết vào ngân sách thành phố, thị xã để sử dụng cho công tác bảo vệ môi trường, đầu tư mới, nạo vét cống rãnh, duy tu, bảo dưỡng hệ thống thoát nước tại địa phương; tổ chức thực hiện các giải pháp, phương án công nghệ, kỹ thuật xử lý nước thải. </span></p>\n<p class=\"prov-content\" style=\"font-family: 'Times New Roman', Times, serif;\"><span style=\"font-size: 14px;\">Đối với các huyện: Điều tiết vào ngân sách cấp xã (nơi phát sinh số thu phí bảo vệ môi trường đối với nước thải sinh hoạt) để sử dụng cho công tác bảo vệ môi trường, đầu tư mới, nạo vét cống rãnh, duy tu, bảo dưỡng hệ thống thoát nước tại địa phương; tổ chức thực hiện các giải pháp, phương án công nghệ, kỹ thuật xử lý nước thải tại địa bàn xã, thị trấn.</span></p>\n<p class=\"prov-clause\" id=\"6b4236e2-df4e-11f0-8481-f3938a56b774\" style=\"font-family: 'Times New Roman', Times, serif;\">2. Đối với nước thải công nghiệp, điều tiết 100% vào ngân sách cấp tỉnh, trong đó:</p>\n<p class=\"prov-item\" id=\"6b4236ec-df4e-11f0-826c-59e0186638c4\" style=\"font-family: 'Times New Roman', Times, serif;\">a) 20% bổ sung cho Quỹ bảo vệ môi trường tỉnh sử dụng cho việc phòng ngừa, hạn chế, kiểm soát ô nhiễm môi trường do nước thải.</p>\n<p class=\"prov-item\" id=\"6b4236f6-df4e-11f0-9f19-d58830a62ccb\" style=\"font-family: 'Times New Roman', Times, serif;\">b) 80% sử dụng cho công tác bảo vệ môi trường; tổ chức thực hiện các giải pháp, phương án công nghệ, kỹ thuật xử lý nước thải.</p>\n<p class=\"prov-clause\" id=\"6b42370a-df4e-11f0-9da7-e369e8727994\" style=\"font-family: 'Times New Roman', Times, serif;\">1. Giao Ủy ban nhân dân tỉnh tổ chức thực hiện Nghị quyết.</p>\n<p class=\"prov-clause\" id=\"6b423714-df4e-11f0-8569-2f998bf80aa4\" style=\"font-family: 'Times New Roman', Times, serif;\">2. Nghị quyết này thay thế Nghị quyết số 50/2016/NQ-HĐND ngày 08 tháng 12 năm 2016 của Hội đồng nhân dân tỉnh quy định về quản lý, sử dụng phí bảo vệ môi trường đối với nước thải trên địa bàn tỉnh Bắc Giang.</p>\n<p style=\"font-size: 14px;\">Nghị quyết này đã được Hội đồng nhân dân tỉnh Bắc Giang Khoá XIX, Kỳ họp thứ 14 thông qua ngày 13 tháng 12 năm 2023 và có hiệu lực từ ngày 01 tháng 01 năm 2024./.</p>\n<div>\n<span style=\"font-size: 14px;\"></span>\n<div style=\"width: 100%; margin-top: 32px; font-family: 'Times New Roman', serif; font-size: 14px; color: #000; display: flex; justify-content: flex-end;\">\n<div style=\"display: table-cell; width: 50%; text-align: center; vertical-align: top; font-weight: bold; line-height: 1.8;\">\n<span style=\"font-size: 14px;\"></span>\n<div style=\"font-weight: bold; text-transform: uppercase; line-height: 1.3;\">\n<span style=\"font-size: 14px;\">CHỦ TỊCH</span>\n</div>\n<div style=\"font-style: italic; font-weight: bold;\">\n<span style=\"font-size: 14px;\">(Đã ký)</span>\n</div>\n<div style=\"font-weight: bold; margin-top: 16px;\">\n<span style=\"font-size: 14px;\">Lê Thị Thu Hồng</span>\n</div>\n</div>\n</div>\n</div></div></body></html>"])</script></body></html>
