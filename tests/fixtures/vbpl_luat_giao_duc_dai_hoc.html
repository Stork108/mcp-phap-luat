ily: 'Times New Roman', serif; font-size: 13.0pt\"><strong>CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM</strong></span></p>\n<p style=\"text-align: center; margin: 0pt 0 0pt; line-height: 18.0pt\"><span style=\"font-family: 'Times New Roman', serif; font-size: 14.0pt\"><strong>Độc lập - Tự do - Hạnh phúc</strong></span></p>\n<p style=\"text-align: center; margin: 0pt 0 0pt; line-height: 1.0\"><span style=\"text-decoration: underline; font-family: 'Times New Roman', serif; font-size: 6.0pt\"><strong>_________________________________________________________</strong></span></p>\n<p> </p></td>\n</tr>\n</tbody>\n</table>\n<p style=\"text-align: center; margin: 6.0pt 0 6.0pt; line-height: 1.0\"><span style=\"font-family: 'Times New Roman', serif; font-size: 15.0pt\"><strong>LUẬT </strong></span></p>\n<p style=\"text-align: center; margin: 6.0pt 0 12.0pt; line-height: 1.0\"><span style=\"font-family: 'Times New Roman', serif; font-size: 15.0pt\"><strong>GIÁO DỤC ĐẠI HỌC</strong></span></p>\n<p style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.0\"><span style=\"font-family: 'Times New Roman', serif; font-size: 14.0pt\"><em>Căn cứ Hiến pháp nước Cộng hòa xã hội chủ nghĩa Việt Nam đã được sửa đổi, bổ sung một số điều theo Nghị quyết số <a href=\"/van-ban/chi-tiet/178314\" rel=\"noopener noreferrer\" target=\"_blank\">203/2025/QH15</a>;</em></span></p>\n<p style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.0\"><span style=\"font-family: 'Times New Roman', serif; font-size: 14.0pt\"><em>Quốc hội ban hành Luật Giáo dục đại học.</em></span></p>\n<p class=\"prov-chapter\" id=\"02fee039-d974-49c5-99ee-181fbf74cc92\" style=\"text-align: center; margin: 6.0pt 0 6.0pt; line-height: 1.0\"><span style=\"font-family: 'Times New Roman', serif; font-size: 14.0pt\"><strong>Chương I      </strong></span></p>\n<p class=\"prov-chapter\" id=\"02fee039-d974-49c5-99ee-181fbf74cc92\" style=\"text-align: center; margin: 6.0pt 0 6.0pt; line-height: 1.0\"><span style=\"font-family: 'Times New Roman', serif; font-size: 14.0pt\"><strong>NHỮNG QUY ĐỊNH CHUNG</strong></span></p>\n<div class=\"docx-tab-cols prov-article\" id=\"c5f52508-cf55-44f6-8aba-4a3e85917ab6\" style=\"display: grid; grid-template-columns: min-content 1fr; gap: 16px; width: 100%; margin: 5px 0;\">\n<div style=\"text-align: center; white-space: nowrap; min-width: 0;\">\n<span style=\"color: #000000; font-family: 'Times New Roman', serif; font-size: 14.0pt\"><strong>Điều 1.</strong></span>\n</div>\n<div style=\"text-align: justify; min-width: 0;\">\n<span style=\"font-family: 'Times New Roman', serif; font-size: 14.0pt\"><strong>Phạm vi điều chỉnh </strong></span>\n</div>\n</div>\n<p class=\"prov-content\" id=\"c5f52508-cf55-44f6-8aba-4a3e85917ab6\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.0\"><span style=\"font-family: 'Times New Roman', serif; font-size: 14.0pt\">Luật này quy định về hoạt động giáo dục đại học; tổ chức và hoạt động của cơ sở giáo dục đại học; quyền hạn và trách nhiệm của tổ chức, cá nhân tham gia giáo dục đại học; trách nhiệm của Nhà nước trong quản lý và phát triển giáo dục đại học. </span></p>\n<div class=\"docx-tab-cols prov-article\" id=\"971d50be-ba94-4996-a5a8-13bf17bbee9b\" style=\"display: grid; grid-template-columns: min-content 1fr; gap: 16px; width: 100%; margin: 5px 0;\">\n<div style=\"text-align: center; white-space: nowrap; min-width: 0;\">\n<span style=\"color: #000000; font-family: 'Times "])</script><script>self.__next_f.push([1, "New Roman', serif; font-size: 14.0pt\"><strong>Điều 2.</strong></span>\n</div>\n<div style=\"text-align: justify; min-width: 0;\">\n<span style=\"font-family: 'Times New Roman', serif; font-size: 14.0pt\"><strong>Đối tượng áp dụng </strong></span>\n</div>\n</div>\n<p class=\"prov-clause\" id=\"219ae65e-e1ce-42bd-a121-88d8eb9529a7\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.0\"><span style=\"font-family: 'Times New Roman', serif; font-size: 14.0pt\">1. Luật này áp dụng đối với cơ sở giáo dục đại học, cơ quan, tổ chức, cá nhân có liên quan.</span></p>\n<p class=\"prov-clause\" id=\"8cca7ed4-30cc-450e-ad96-1f4e808428af\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.0\"><span style=\"font-family: 'Times New Roman', serif; font-size: 14.0pt\">2. Cơ sở giáo dục khác có hoạt động giáo dục đại học áp dụng quy định của Luật này trong phạm vi hoạt động giáo dục đại học. </span></p>\n<p class=\"prov-clause\" id=\"21d54199-25e8-4fec-8891-750e7948f208\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.0\"><span style=\"font-family: 'Times New Roman', serif; font-size: 14.0pt\">11. Cơ sở đào tạo đã có quyết định mở ngành ban hành trước ngày 01 tháng 01 năm 2026 tiếp tục thực hiện theo các nội dung ghi trong quyết định và phải đáp ứng chuẩn chương trình đào tạo được ban hành trước ngày 01 tháng 01 năm 2026 trong thời hạn 36 tháng kể từ ngày 01 tháng 01 năm 2026. Trường hợp chuẩn chương trình đào tạo được sửa đổi, bổ sung trong thời hạn này thì thực hiện theo hướng dẫn của Bộ trưởng Bộ Giáo dục và Đào tạo.</span></p>\n<p class=\"prov-clause\" id=\"1c114192-5ec4-42a8-a46d-45798865df09\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.0\"><span style=\"font-family: 'Times New Roman', serif; font-size: 14.0pt\">12. Phân hiệu của cơ sở giáo dục đại học đã có quyết định cấp phép hoạt động, các địa điểm đào tạo đang triển khai thực hiện hoạt động giáo dục đại học trước ngày 01 tháng 01 năm 2026 thì được tiếp tục hoạt động và phải đáp ứng quy định về phân hiệu, địa điểm đào tạo của Luật này trong thời hạn 48 tháng kể từ ngày 01 tháng 01 năm 2026. Trường hợp quy định về phân hiệu, địa điểm đào tạo được sửa đổi, bổ sung trong thời hạn này thì thực hiện theo hướng dẫn của Bộ trưởng Bộ Giáo dục và Đào tạo.</span></p>\n<p class=\"prov-content\" id=\"1c114192-5ec4-42a8-a46d-45798865df09\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.0\"><span style=\"font-family: 'Times New Roman', serif; font-size: 14.0pt\"><em>Luật này được Quốc hội nước Cộng hòa xã hội chủ nghĩa Việt Nam khóa XV, Kỳ họp thứ 10 thông qua ngày 10 tháng 12 năm 2025.</em></span></p>\n<table border=\"0\" class=\"prov-table\" id=\"1c114192-5ec4-42a8-a46d-45798865df09\" style=\"border-collapse: collapse; width: 100%; margin: 15px 0;\">\n<tbody>\n<tr>\n<td style=\"background-color: #FFFFFF; padding: 8px;\">\n<p class=\"prov-content\"> </p></td>\n<td style=\"background-color: #FFFFFF; padding: 8px;\">\n<p class=\"prov-content\" style=\"text-align: center; margin: 12.0pt 0 6.0pt; line-height: 1.0\"><span style=\"font-family: 'Times New Roman', serif; font-size: 14.0pt\"><strong>CHỦ TỊCH QUỐC HỘI</strong></span></p>\n<p class=\"prov-content\" style=\"text-align: center; margin: 12.0pt 0 6.0pt; line-height: 1.0\"><span style=\"font-family: 'Times New Roman', serif; font-size: 14.0pt\"><strong>Trần Thanh Mẫn</strong></span></p></td>\n</tr>\n</tbody>\n</table></div></body></html>"])</script></body></html>
