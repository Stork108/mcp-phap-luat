"code\": null, \"parentCode\": null, \"parentName\": null}], \"documentRelatedList\": [], \"isEffectAllDocument\": false, \"isOld\": true, \"reviewStatus\": \"RV_DONE\", \"reviewed\": true, \"isTranslationDoc\": false, \"isConsolidatedDocument\": false, \"isConstitutionDocument\": false, \"isAdministrativeDocument\": false, \"viewCount\": 1161, \"showViewCount\": true, \"hasContent\": true, \"hasOriginalPdf\": true, \"hasAIProcessed\": false, \"hasClauseRelation\": true}, \"locale\": \"vi\"}]\n2b:T2f2c,<html><head></head><body><div class=\"docx-page\"><table border=\"1\" cellpadding=\"0\" cellspacing=\"0\" class=\"MsoNormalTable\" style=\"border-collapse: collapse; border: none; width: 95.4594%; height: 140px;\">\n<tbody>\n<tr style=\"height: 91.0085px;\">\n<td style=\"width: 53.014%; border: none; padding: 0in 5.4pt;\" valign=\"top\" width=\"223\">\n<p align=\"center\" class=\"MsoNormal\" style=\"text-align: center; background: white; mso-shading: windowtext; mso-pattern: solid white;\"><b><span style=\"color: black; mso-color-alt: windowtext;\">QUỐC HỘI<br/>\n          --------</span></b></p></td>\n<td style=\"width: 46.986%; border: none; padding: 0in 5.4pt;\" valign=\"top\" width=\"367\">\n<p align=\"center\" class=\"MsoNormal\" style=\"text-align: center; background: white; mso-shading: windowtext; mso-pattern: solid white;\"><b><span style=\"color: black; mso-color-alt: windowtext;\">CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM<br/>\n          Độc lập - Tự do - Hạnh phúc <br/>\n          ---------------</span></b></p></td>\n</tr>\n<tr style=\"height: 48.9915px;\">\n<td style=\"width: 53.014%; border: none; padding: 0in 5.4pt;\" valign=\"top\" width=\"223\">\n<p align=\"center\" class=\"MsoNormal\" style=\"text-align: center; background: white; mso-shading: windowtext; mso-pattern: solid white;\"><span style=\"color: black; mso-color-alt: windowtext;\">Bộ luật số: 45/2019/QH14</span></p></td>\n<td style=\"width: 46.986%; border: none; padding: 0in 5.4pt;\" valign=\"top\" width=\"367\">\n<p align=\"right\" class=\"MsoNormal\" style=\"background: white; text-align: center;\"><i><span style=\"color: black; mso-color-alt: windowtext;\">Hà Nội, ngày 20 tháng 11 năm 2019</span></i></p></td>\n</tr>\n</tbody>\n</table>\n<p class=\"MsoNormal\" style=\"margin-bottom: 6.0pt;\"> </p>\n<p align=\"center\" class=\"MsoNormal\" style=\"margin-bottom: 6.0pt; text-align: center;\"><b>BỘ LUẬT</b></p>\n<p align=\"center\" class=\"MsoNormal\" style=\"margin-bottom: 6.0pt; text-align: center;\"><b>LAO ĐỘNG</b></p>\n<p class=\"MsoNormal\" style=\"mso-margin-bottom-alt: auto;\"><i><span style=\"font-size: 10.0pt; mso-bidi-font-size: 12.0pt; font-family: 'Arial',sans-serif; mso-fareast-font-family: Arial; mso-ansi-language: NL;\">Căn cứ Hiến pháp nước C"])</script><script>self.__next_f.push([1, "ộng hòa xã hội chủ nghĩa Việt Nam;</span></i></p>\n<p class=\"MsoNormal\" style=\"mso-margin-bottom-alt: auto;\"><i><span style=\"font-size: 10.0pt; mso-bidi-font-size: 12.0pt; font-family: 'Arial',sans-serif; mso-fareast-font-family: Arial; mso-ansi-language: NL;\">Quốc hội ban hành Bộ luật Lao động.</span></i></p>\n<p align=\"center\" class=\"MsoNormal prov-chapter\" id=\"edbf3bf0-1c8f-11f1-86e6-e13e379a644e\" style=\"margin-bottom: 6.0pt;\"><strong>Chương I</strong></p>\n<p align=\"center\" class=\"MsoNormal prov-chapter\" id=\"edbf3bf0-1c8f-11f1-86e6-e13e379a644e\" style=\"margin-bottom: 6.0pt; text-align: center;\"><strong>NHỮNG QUY ĐỊNH CHUNG</strong></p>\n<p class=\"MsoNormal prov-article\" id=\"3b82dbe0-315c-11f1-a6ce-a95a72d62c0d\" style=\"margin-bottom: 6.0pt;\"><strong><b>Điều 1. Phạm vi điều chỉnh</b></strong></p>\n<p class=\"MsoNormal prov-content\" style=\"margin-bottom: 6.0pt;\">Bộ luật Lao động quy định tiêu chuẩn lao động; quyền, nghĩa vụ, trách nhiệm của người lao động, người sử dụng lao động, tổ chức đại diện người lao động tại cơ sở, tổ chức đại diện người sử dụng lao động trong quan hệ lao động và các quan hệ khác liên quan trực tiếp đến quan hệ lao động; quản lý nhà nước về lao động.</p>\n<p class=\"MsoNormal prov-article\" id=\"3b832a00-315c-11f1-99ef-03e8d58ac040\" style=\"margin-bottom: 6.0pt;\"><strong><b>Điều 2. Đối tượng áp dụng</b></strong></p>\n<p class=\"MsoNormal prov-clause\" id=\"3b835110-315c-11f1-a6c6-d3e53cc4b161\" style=\"margin-bottom: 6.0pt;\">1. Người lao động, người học nghề, người tập nghề và người làm việc không có quan hệ lao động.</p>\n<p class=\"MsoNormal prov-clause\" id=\"3b837820-315c-11f1-9fb4-e35e79d33444\" style=\"margin-bottom: 6.0pt;\">2. Người sử dụng lao động.</p>\n<p class=\"MsoNormal prov-clause\" id=\"3b839f30-315c-11f1-b66d-5d8432583580\" style=\"margin-bottom: 6.0pt;\">3. Người lao động nước ngoài làm việc tại Việt Nam.</p>\n<p class=\"MsoNormal prov-clause\" id=\"3b83ed50-315c-11f1-b44f-53b7fd0d884e\" style=\"margin-bottom: 6.0pt;\">4. Cơ quan, tổ chức, cá nhân khác có liên quan trực tiếp đến quan hệ lao động.</p>\n<p class=\"MsoNormal prov-article\" id=\"3b841460-315c-11f1-8cb5-9b90afcdb84c\" style=\"margin-bottom: 6.0pt;\"><strong><b>Điều 3. Giải thích từ ngữ</b></strong></p>\n<p class=\"MsoNormal prov-content\" style=\"margin-bottom: 6.0pt;\">Trong Bộ luật này, các từ ngữ dưới đây được hiểu như sau:</p>\n<p class=\"MsoNormal prov-clause\" id=\"3b843b70-315c-11f1-83b8-cdeae211d946\" style=\"margin-bottom: 6.0pt;\">1. <i>Người lao động</i> là người làm việc cho người sử dụng lao động theo thỏa thuận, được trả lương và chịu sự quản lý, điều hành, giám sát của người sử dụng lao động.</p>\n<p class=\"MsoNormal prov-content\" style=\"margin-bottom: 6.0pt;\">Độ tuổi lao động tối thiểu của người lao động là đủ 15 tuổi, trừ trường hợp quy định tại Mục 1 Chương XI của Bộ luật này.</p>\n<p class=\"MsoNormal prov-clause\" id=\"3b848990-315c-11f1-90d8-f93c98641693\" style=\"margin-bottom: 6.0pt;\">2. <i>Người sử dụng lao động</i> là doanh nghiệp, cơ quan, tổ chức, hợp tác xã, hộ gia đình, cá nhân có thuê mướn, sử dụng người lao động làm việc cho mình theo thỏa thuận; trường hợp người sử dụng lao động là cá nhân thì phải có năng lực hành vi dân sự đầy đủ.</p>\n<p class=\"MsoNormal prov-clause\" id=\"3b84b0a0-315c-11f1-91f0-35d4ab0104e6\" style=\"margin-bottom: 6.0pt;\">3. <i>Tổ chức đại diện người lao động tại cơ sở</i> là tổ chức được thành lập trên cơ sở tự nguyện của người lao động tại một đơn vị sử dụng lao động nhằm mục đích bảo vệ quyền và lợi ích hợp pháp, chính đáng của người lao động trong quan hệ lao động thông qua thương lượng tập thể hoặc các hình thức khác theo quy định của pháp luật về lao động. Tổ chức đại diện người lao động tại cơ sở bao gồm công đoàn cơ sở và tổ chức của người lao động tại doanh nghiệp.</p>\n<p class=\"MsoNormal prov-clause\" id=\"3b84d7b0-315c-11f1-a091-75732dbdad26\" style=\"margin-bottom: 6.0pt;\">4. <i>Tổ chức đại diện người sử dụng lao động</i> là tổ chức được thành lập hợp pháp, đại diện và bảo vệ quyền, lợi ích hợp pháp của người sử dụng lao động trong quan hệ lao động.</p>\n<p class=\"MsoNormal prov-clause\" id=\"3b8525d0-315c-11f1-85ea-45bb3937ad98\" style=\"margin-bottom: 6.0pt;\">5. <i>Quan hệ lao động</i> là quan hệ xã hội phát sinh trong việc thuê mướn"])</script><script>self.__next_f.push([1, ", sử dụng lao động, trả lương giữa người lao động, người sử dụng lao động, các tổ chức đại diện của các bên, cơ quan nhà nước có thẩm quyền. Quan hệ lao động bao gồm quan hệ lao động cá nhân và quan hệ lao động tập thể.</p>\n<p class=\"MsoNormal prov-clause\" id=\"3b854ce0-315c-11f1-969c-5d9c3ca8c108\" style=\"margin-bottom: 6.0pt;\">6. <i>Người làm việc không có quan hệ lao động</i> là người làm việc không trên cơ sở thuê mướn bằng hợp đồng lao động.</p>\n<p class=\"MsoNormal prov-clause\" id=\"3b8573f0-315c-11f1-a3d3-e549efbf8f38\" style=\"margin-bottom: 6.0pt;\">7. <i>Cưỡng bức lao động</i> là việc dùng vũ lực, đe dọa dùng vũ lực hoặc các thủ đoạn khác để ép buộc người lao động phải làm việc trái ý muốn của họ.</p>\n<p class=\"MsoNormal prov-clause\" id=\"3b859b00-315c-11f1-9012-4d462226c06e\" style=\"margin-bottom: 6.0pt;\">8. <i>Phân biệt đối xử trong lao động</i> là hành vi phân biệt, loại trừ hoặc ưu tiên dựa trên chủng tộc, màu da, nguồn gốc quốc gia hoặc nguồn gốc xã hội, dân tộc, giới tính, độ tuổi, tình trạng thai sản, tình trạng hôn nhân, tôn giáo, tín ngưỡng, chính kiến, khuyết tật, trách nhiệm gia đình hoặc trên cơ sở tình trạng nhiễm HIV hoặc vì lý do thành lập, gia nhập và hoạt động công đoàn, tổ chức của người lao động tại doanh nghiệp có tác động làm ảnh hưởng đến bình đẳng về cơ hội việc làm hoặc nghề nghiệp.</p>\n<p class=\"MsoNormal prov-content\" style=\"margin-bottom: 6.0pt;\">Việc phân biệt, loại trừ hoặc ưu tiên xuất phát từ yêu cầu đặc thù của công việc và các hành vi duy trì, bảo vệ việc làm cho người lao động dễ bị tổn thương thì không bị xem là phân biệt đối xử.</p>\n<p class=\"MsoNormal prov-clause\" id=\"3b85e920-315c-11f1-95eb-85b8bf267e73\" style=\"margin-bottom: 6.0pt;\">9. <i>Quấy rối tình dục tại nơi làm việc</i> là hành vi có tính chất tình dục của bất kỳ người nào đối với người khác tại nơi làm việc mà không được người đó mong muốn hoặc chấp nhận. Nơi làm việc là bất kỳ nơi nào mà người lao động thực tế làm việc theo thỏa thuận hoặc phân công của người sử dụng lao động.</p>\n<p class=\"MsoNormal prov-clause\" id=\"7ebb81e4-316d-11f1-b01a-7f80ed0376da\" style=\"margin-bottom: 6.0pt;\">3. Chế độ lao động đối với cán bộ, công chức, viên chức, người thuộc lực lượng Quân đội nhân dân, Công an nhân dân, tổ chức xã hội, xã viên hợp tác xã, người làm việc không có quan hệ lao động do các văn bản pháp luật khác quy định nhưng tùy từng đối tượng mà được áp dụng một số quy định trong Bộ luật này.</p>\n<p class=\"MsoNormal\" style=\"margin-bottom: 6.0pt;\"><i><span style=\"mso-ansi-language: FR;\">Bộ luật này được Quốc hội nước Cộng hòa xã hội chủ nghĩa Việt Nam khóa XIV, kỳ họp thứ 8 thông qua ngày 20 tháng 11 năm 2019./.</span></i></p>\n<table border=\"1\" cellpadding=\"0\" cellspacing=\"0\" class=\"MsoNormalTable\" style=\"border-collapse: collapse; border: none; width: 93.6459%;\">\n<tbody>\n<tr style=\"mso-yfti-irow: 0; mso-yfti-firstrow: yes; mso-yfti-lastrow: yes;\">\n<td style=\"width: 46.5762%; border: none; padding: 0in 5.4pt;\" valign=\"top\" width=\"271\">\n<p class=\"MsoNormal\"><b> </b></p></td>\n<td style=\"width: 53.4238%; border: none; padding: 0in 5.4pt;\" valign=\"top\" width=\"319\">\n<p align=\"center\" class=\"MsoNormal\" style=\"text-align: center;\"><b><span style=\"mso-ansi-language: FR;\">CHỦ TỊCH QUỐC HỘI<br/>\n          Đã ký: </span></b><span style=\"mso-ansi-language: FR;\"><b>Nguyễn Thị Kim Ngân</b></span></p></td>\n</tr>\n</tbody>\n</table>\n<table border=\"0\" style=\"border-collapse: collapse; width: 100%;\">\n<colgroup>\n<col style=\"width: 49.9734%;\"/>\n<col style=\"width: 49.9734%;\"/>\n</colgroup>\n<tbody>\n<tr>\n<td style=\"text-align: center;\"><strong>VĂN PHÒNG</strong><br/><strong>CHỦ TỊCH NƯỚC</strong><br/><strong>____________</strong><br/><strong>Số: 15/SY-VPCTN</strong></td>\n<td>\n<p style=\"font-family: 'Times New Roman', Times, serif; text-align: center;\"><strong>SAO Y BẢN CHÍNH</strong></p>\n<p style=\"font-family: 'Times New Roman', Times, serif; text-align: center;\"><em>Hà Nội, ngày 06 tháng 12 năm 2019</em></p>\n<p style=\"font-family: 'Times New Roman', Times, serif; text-align: center;\"><strong>KT. CHỦ NHIỆM</strong><br/><strong>PHÓ CHỦ NHIỆM</strong><br/><strong>(đã ký)</strong><br/><strong>Phạm Thanh Hà</strong></p></td>\n</tr>\n</tbody>\n</table></div></body></html>"])</script></body></html>
